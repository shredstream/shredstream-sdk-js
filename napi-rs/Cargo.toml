[package]
name = "shredstream-napi"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi8", "tokio_rt", "async"] }
napi-derive = "2.16"
shredstream = "2.0.0"
bincode = "1.3"
solana-transaction = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2"
