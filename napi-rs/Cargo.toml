[package]
name = "shredstream-napi"
version = "2.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi8", "tokio_rt", "async"] }
napi-derive = "2.16"
shredstream = "3.0.0"
solana-transaction = { version = "=4.1.6", features = ["serde", "wincode"] }
wincode = "=0.5.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2"
